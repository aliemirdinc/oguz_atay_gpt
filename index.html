<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Oğuz Atay</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Tutunamayanlar GPT</h1>
            <p>Oğuz Atay'ın zihninden simüle edilmiştir.</p>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message bot-message">
                <div class="avatar">O</div>
                <div class="content">Ben Selim Işık... Ya da onun kelimelerinden oluşmuş bir hayaletim. Sormak istediğin bir şey var mı azizim?</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Bir şeyler yaz..." autocomplete="off">
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="module" src="script.js?v=son_surum_fix_3"></script>
</body>
</html>
